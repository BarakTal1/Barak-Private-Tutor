<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
@keyframes tt-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes tt-jump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-14px) scale(1.04,.96)}60%{transform:translateY(0) scale(1.06,.92)}80%{transform:translateY(-3px)}100%{transform:none}}
@keyframes tt-lean{0%,100%{transform:rotate(-7deg) translateX(2px)}50%{transform:rotate(-10deg) translateX(4px)}}
@keyframes tt-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03,.97)}}
@keyframes tt-dance{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-6px)}}
@keyframes tt-talk{0%{transform:scaleY(.55)}100%{transform:scaleY(1)}}
@keyframes tt-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes tt-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes tt-z{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px) scale(1.1)}}
@keyframes tt-dot{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes tt-spark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){svg[data-tutor] *{animation:none!important}}
</style></helmet>
<span style="display:inline-flex;line-height:0">{{ svg }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;120px&quot;,&quot;height&quot;:&quot;120px&quot;},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;talk&quot;,&quot;think&quot;,&quot;cheer&quot;,&quot;encourage&quot;,&quot;lean&quot;,&quot;sleepy&quot;,&quot;dance&quot;,&quot;still&quot;],&quot;default&quot;:&quot;talk&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:96,&quot;tsType&quot;:&quot;number&quot;},&quot;rm&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement;
    const mood = this.props.mood || 'talk';
    const size = +this.props.size || 48;
    const rm = this.props.rm === true || this.props.rm === 'true';
    const A = v => (rm ? 'none' : v);
    const fb = { transformBox: 'fill-box', transformOrigin: '50% 100%' };
    const fc = { transformBox: 'fill-box', transformOrigin: '50% 50%' };
    const BOLT = 'var(--bolt,#ffc93c)', EDGE = 'var(--bolt-edge,#e29a00)', ink = '#2a1d05';
    const bodyAnim = { talk: 'tt-bob 2.6s ease-in-out infinite', think: 'tt-bob 1.4s ease-in-out infinite', cheer: 'tt-jump .7s cubic-bezier(.3,1.5,.5,1) 2', encourage: 'tt-breathe 2.6s ease-in-out infinite', lean: 'tt-lean 2.8s ease-in-out infinite', sleepy: 'tt-breathe 3.4s ease-in-out infinite', dance: 'tt-dance .55s ease-in-out infinite', still: 'none' }[mood] || 'none';
    const happy = mood === 'cheer' || mood === 'dance';
    const EX = [39, 60], EY = 46;
    let eyes;
    if (happy) eyes = h('g', { key: 'e', stroke: ink, strokeWidth: 3.6, fill: 'none', strokeLinecap: 'round' }, EX.map(x => h('path', { key: x, d: `M${x - 6} ${EY + 2} Q${x} ${EY - 6} ${x + 6} ${EY + 2}` })));
    else if (mood === 'sleepy') eyes = h('g', { key: 'e', stroke: ink, strokeWidth: 3.2, fill: 'none', strokeLinecap: 'round' }, EX.map(x => h('path', { key: x, d: `M${x - 6} ${EY} Q${x} ${EY + 5} ${x + 6} ${EY}` })));
    else {
      const up = mood === 'think', dx = up ? -2 : 1, dy = up ? -3 : 1;
      eyes = h('g', { key: 'e', style: { ...fc, animation: A('tt-blink 4.2s infinite') } },
        EX.map(x => h('g', { key: x }, h('circle', { cx: x, cy: EY, r: 7, fill: '#fff' }), h('circle', { cx: x + dx, cy: EY + dy, r: 3.8, fill: ink }), h('circle', { cx: x + dx + 1.3, cy: EY + dy - 1.3, r: 1.3, fill: '#fff' }))));
    }
    const MX = 50, MY = 55;
    let mouth;
    if (mood === 'talk') mouth = h('path', { key: 'm', d: `M${MX - 8} ${MY - 2} Q${MX} ${MY + 10} ${MX + 8} ${MY - 2} Z`, fill: ink, style: { transformBox: 'fill-box', transformOrigin: '50% 0%', animation: A('tt-talk .3s ease-in-out infinite alternate') } });
    else if (happy) mouth = h('path', { key: 'm', d: `M${MX - 8} ${MY - 3} Q${MX} ${MY + 10} ${MX + 8} ${MY - 3} Z`, fill: ink });
    else if (mood === 'think') mouth = h('path', { key: 'm', d: `M${MX - 4} ${MY + 1} Q${MX} ${MY - 1} ${MX + 5} ${MY}`, stroke: ink, strokeWidth: 3.2, fill: 'none', strokeLinecap: 'round' });
    else if (mood === 'sleepy') mouth = h('circle', { key: 'm', cx: MX, cy: MY + 1, r: 2.6, fill: ink });
    else mouth = h('path', { key: 'm', d: `M${MX - 7} ${MY - 2} Q${MX} ${MY + 6} ${MX + 7} ${MY - 2}`, stroke: ink, strokeWidth: 3.4, fill: 'none', strokeLinecap: 'round' });
    const arm = (key, cx, cy, rot, anim) => h('ellipse', { key, cx, cy, rx: 4.5, ry: 8.5, fill: BOLT, stroke: EDGE, strokeWidth: 2.5, transform: `rotate(${rot} ${cx} ${cy})`, style: anim ? { ...fb, animation: A(anim) } : undefined });
    const armL = happy ? arm('al', 16, 34, -35, 'tt-wave .4s ease-in-out infinite') : arm('al', 12, 56, 30);
    const armR = happy ? arm('ar', 86, 26, 35, 'tt-wave .4s .2s ease-in-out infinite')
      : (mood === 'encourage' || mood === 'lean') ? arm('ar', 86, 36, -50, 'tt-wave 1.2s ease-in-out infinite') : arm('ar', 88, 44, -25);
    const extras = [];
    if (mood === 'think') [0, 1, 2].forEach(i => extras.push(h('circle', { key: 'd' + i, cx: 80 + i * 6, cy: 18 - i * 5, r: 2.2 + i * .8, fill: EDGE, style: { animation: A(`tt-dot 1.2s ${i * .2}s ease-in-out infinite`) } })));
    if (mood === 'sleepy') extras.push(h('text', { key: 'z', x: 78, y: 22, fontSize: 16, fontWeight: 700, fill: EDGE, fontFamily: 'Rubik, sans-serif', style: { animation: A('tt-z 2.4s ease-in-out infinite') } }, 'z'));
    if (happy) [[14, 14], [88, 60], [24, 82]].forEach(([x, y], i) => extras.push(h('path', { key: 's' + i, d: `M${x} ${y - 6} L${x + 1.6} ${y - 1.6} L${x + 6} ${y} L${x + 1.6} ${y + 1.6} L${x} ${y + 6} L${x - 1.6} ${y + 1.6} L${x - 6} ${y} L${x - 1.6} ${y - 1.6} Z`, fill: EDGE, style: { ...fc, animation: A(`tt-spark .9s ${i * .25}s ease-in-out infinite`) } })));
    const labels = { talk: 'מדבר', think: 'חושב', cheer: 'שמח', encourage: 'מעודד', lean: 'רוכן לעזור', sleepy: 'ממתין', dance: 'רוקד', still: 'מקשיב' };
    const svg = h('svg', { 'data-tutor': mood, width: size, height: size, viewBox: '0 0 100 100', role: 'img', 'aria-label': 'ברק, המורה: ' + (labels[mood] || ''), style: { overflow: 'visible', display: 'block' } },
      h('ellipse', { cx: 50, cy: 97, rx: 20, ry: 3, fill: '#000', opacity: .1 }),
      h('g', { style: { ...fb, animation: A(bodyAnim) } },
        armL, armR,
        h('path', { d: 'M63 4 L14 58 L42 58 L31 96 L87 37 L58 37 L73 4 Z', fill: BOLT, stroke: EDGE, strokeWidth: 7, strokeLinejoin: 'round' }),
        h('path', { d: 'M63 12 L52 25', stroke: '#fff', strokeWidth: 4, strokeLinecap: 'round', opacity: .6 }),
        h('circle', { cx: 27, cy: 53, r: 4.5, fill: 'var(--cheek,#ff8f6b)', opacity: .7 }),
        h('circle', { cx: 71, cy: 49, r: 4.5, fill: 'var(--cheek,#ff8f6b)', opacity: .7 }),
        eyes, mouth),
      extras);
    return { svg };
  }
}
</script>
</body>
</html>
